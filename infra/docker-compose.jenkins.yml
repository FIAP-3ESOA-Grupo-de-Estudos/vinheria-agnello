name: vinheria-agnello-ci

services:
  jenkins:
    build: ./jenkins
    image: agnello-jenkins
    container_name: agnello-jenkins
    user: root
    ports:
      - "127.0.0.1:8085:8080"
      - "50000:50000"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - ../:/var/workspace/vinheria-agnello
      - C:/deploy-vinheria:/var/www/vinheria-agnello
