no-resolv
server=8.8.8.8
server=1.1.1.1
domain=agnello.internal
expand-hosts
local=/agnello.internal/
# Loopback is not added implicitly by listen-address; the container healthcheck queries it.
listen-address=127.0.0.1
listen-address=172.28.0.2
bind-interfaces
no-hosts
log-queries
log-facility=-
# Fixed hosts: addresses and names follow ../NETWORK.md.
host-record=catalog.agnello.internal,172.28.0.11
host-record=order.agnello.internal,172.28.0.12

# DHCP.
dhcp-range=172.28.0.100,172.28.0.199,255.255.255.0,12h
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.2
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
# Without no-ping dnsmasq delays every offer by about 3 seconds.
no-ping
# Lease-table reservations mirror the host records above; MACs follow ../NETWORK.md.
dhcp-host=02:42:ac:1c:00:0b,172.28.0.11,catalog
dhcp-host=02:42:ac:1c:00:0c,172.28.0.12,order
