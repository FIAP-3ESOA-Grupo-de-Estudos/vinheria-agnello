name: vinheria-agnello

services:
  dnsmasq:
    build: ./dnsmasq
    image: agnello-dnsmasq
    container_name: agnello-dnsmasq
    cap_add:
      - NET_ADMIN
    networks:
      agnello-net:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "nslookup catalog.agnello.internal 127.0.0.1 | grep -qFx 'Address: 172.28.0.11'"]
      interval: 2s
      timeout: 2s
      retries: 3

  # One-shot job: generates the CA, the two services' certificates, the JWT key and the demo
  # password into the agnello-pki volume, the first time only (see security/README.md).
  pki:
    build: ./security/pki
    image: agnello-pki
    container_name: agnello-pki
    restart: "no"
    network_mode: none
    volumes:
      - agnello-pki:/pki

  catalog:
    build: ../services/catalog-service
    image: agnello-catalog
    container_name: agnello-catalog
    environment:
      # HTTPS on 8081. docker-compose.insecure.yml turns this off for the Wireshark comparison.
      SPRING_PROFILES_ACTIVE: tls
      HEALTH_URL: https://localhost:8081/health
    volumes:
      - agnello-pki:/run/agnello:ro
    ports:
      # Loopback only: defence in depth, even with TLS and JWT other machines on the network have no business here.
      - "127.0.0.1:8081:8081"
    networks:
      agnello-net:
        ipv4_address: 172.28.0.11
        mac_address: 02:42:ac:1c:00:0b
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/run/agnello/ca.crt \"$$HEALTH_URL\" | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      dnsmasq:
        condition: service_healthy
      pki:
        condition: service_completed_successfully

  # Does not depend on the Catalog Service: it starts and stays healthy even when that one is down.
  order:
    build: ../services/order-service
    image: agnello-order
    container_name: agnello-order
    # dnsmasq is the resolver, so catalog.agnello.internal is answered by it.
    dns:
      - 172.28.0.2
    environment:
      # HTTPS on 8082, and the Catalog Service reached over HTTPS, its certificate checked against the internal CA.
      SPRING_PROFILES_ACTIVE: tls
      HEALTH_URL: https://localhost:8082/health
      # Where the Catalog Service lives: its DNS name and port, resolved through dnsmasq.
      CATALOG_URL: https://catalog.agnello.internal:8081
    volumes:
      - agnello-pki:/run/agnello:ro
    ports:
      # Loopback only: defence in depth, even with TLS and JWT other machines on the network have no business here.
      - "127.0.0.1:8082:8082"
    networks:
      agnello-net:
        ipv4_address: 172.28.0.12
        mac_address: 02:42:ac:1c:00:0c
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/run/agnello/ca.crt \"$$HEALTH_URL\" | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      dnsmasq:
        condition: service_healthy
      pki:
        condition: service_completed_successfully

  # One-shot job: does a real DHCP handshake, then exits 0.
  probe:
    build: ./probe
    image: agnello-probe
    container_name: agnello-probe
    restart: "no"
    cap_add:
      - NET_ADMIN
    networks:
      - agnello-net
    # The probe starts last, so plain `up -d` returns only when its dependencies are healthy.
    depends_on:
      dnsmasq:
        condition: service_healthy
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy

  # Tools image for verify.sh and security/capture.sh (curl, tcpdump, tshark). Built, never started by `up`.
  netlab:
    build: ./security/netlab
    image: agnello-netlab
    profiles: ["tools"]

networks:
  agnello-net:
    name: agnello-net
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  # TLS certificates and secrets, generated by the pki job; survives `down`, removed by `down -v`.
  agnello-pki:
    name: agnello-pki
