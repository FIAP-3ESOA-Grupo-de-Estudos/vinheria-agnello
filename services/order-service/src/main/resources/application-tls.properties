# Profile "tls" (the default in infra/docker-compose.yml): the same port, HTTPS only, and the Catalog Service
# reached over HTTPS with its certificate checked against the environment's CA.
# Without this profile the service speaks plain HTTP; infra/docker-compose.insecure.yml uses that for the Wireshark comparison.
server.ssl.bundle=order-tls
spring.ssl.bundle.pem.order-tls.keystore.certificate=file:${agnello.pki-dir}/order.crt
spring.ssl.bundle.pem.order-tls.keystore.private-key=file:${agnello.pki-dir}/order.key
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.agnello-ca.truststore.certificate=file:${agnello.pki-dir}/ca.crt
catalog.ssl-bundle=agnello-ca
