server.port=8082
# Where the Catalog Service lives: its DNS name and port, from the environment (see infra/docker-compose.yml).
catalog.url=${CATALOG_URL}
# A Catalog Service that is down must not leave the Order Service waiting: give up quickly, answer service-unavailable.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s
# Where the environment keeps its TLS certificates and secrets: the agnello-pki volume (see infra/security).
agnello.pki-dir=${AGNELLO_PKI_DIR:/run/agnello}
# The HS256 key shared with the Catalog Service: this service signs with it, the Catalog Service verifies.
agnello.jwt.secret=file:${agnello.pki-dir}/jwt.secret
# The demo customer's password (user "cliente").
agnello.demo.password=file:${agnello.pki-dir}/demo-password
