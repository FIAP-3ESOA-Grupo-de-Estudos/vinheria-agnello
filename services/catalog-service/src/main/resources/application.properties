server.port=8081
# Where the environment keeps its TLS certificates and the JWT key: the agnello-pki volume (see infra/security).
agnello.pki-dir=${AGNELLO_PKI_DIR:/run/agnello}
# The HS256 key shared with the Order Service, which signs the tokens this service accepts.
agnello.jwt.secret=file:${agnello.pki-dir}/jwt.secret
