# Profile "tls" (the default in infra/docker-compose.yml): the same port, HTTPS only.
# Without this profile the service speaks plain HTTP; infra/docker-compose.insecure.yml uses that for the Wireshark comparison.
server.ssl.bundle=catalog-tls
spring.ssl.bundle.pem.catalog-tls.keystore.certificate=file:${agnello.pki-dir}/catalog.crt
spring.ssl.bundle.pem.catalog-tls.keystore.private-key=file:${agnello.pki-dir}/catalog.key
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
